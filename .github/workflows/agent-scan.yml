name: Agent/Skill Security Scan
run-name: "PR #${{ github.event.pull_request.number }} | ${{ github.event.pull_request.title }}"

on:
  # Required workflows must report on every PR. Scope the costly jobs below,
  # rather than leaving a path-filtered required check permanently pending.
  pull_request:

# Least privilege by default: every job can only read. The one job that
# writes (aggregate) asks for its extra permissions itself, so the jobs that
# install third-party packages never hold a write-capable token.
permissions:
  contents: read

# One scan per PR: a newer push cancels the older run so a stale result can
# never overwrite the PR comment after a newer one lands.
concurrency:
  group: agent-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Pinned tool versions, in one place. A security gate must behave the same
# on every run; "latest" means an upstream release can change the verdict.
# The weekly copilot-probe workflow reads these values too.
# Actions use verified commit pins with release labels. The fixed runner image
# avoids an ubuntu-latest migration changing the rehearsal environment.
env:
  COPILOT_CLI_VERSION: "1.0.94"
  SKILL_SCANNER_VERSION: "2.2.1"
  NODE_VERSION: "24.21.0" # Current LTS, rather than the non-LTS release line
  PYTHON_VERSION: "3.14.8" # Latest stable line supported by scanner (<3.15)

defaults:
  run:
    shell: bash

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Detect which agent/skill files changed
  #   Scope is ALL files under agent/skill dirs,
  #   not just *.md — malicious payloads ride in
  #   bundled scripts and test files, not only in
  #   instruction markdown (Gecko Security, 2026).
  # ──────────────────────────────────────────────
  detect_changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
      changed_files: ${{ steps.detect.outputs.changed_files }}
    steps:
      # persist-credentials: false (on every checkout in this file) keeps the
      # job token out of .git/config, where installed tools could read it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changed agent/skill files
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ROOTS=(.github/agents .github/skills .claude/agents .claude/skills .agents/skills)
          LIST="$RUNNER_TEMP/asq-scan-paths"
          # Capture git failures before reading paths. NUL records keep hostile
          # filenames from becoming shell syntax or fabricated list entries.
          git diff --name-only -z --diff-filter=d "$BASE_SHA"...HEAD -- "${ROOTS[@]}" > "$LIST"
          CONFIG_CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD -- \
            .github/workflows/agent-scan.yml .github/workflows/copilot-probe.yml prompts)
          if [ -n "$CONFIG_CHANGED" ]; then
            # Changing the judge must exercise it, even without an agent edit.
            git ls-files -z -- "${ROOTS[@]}" > "$LIST"
          fi
          mapfile -d '' -t PATHS < "$LIST"
          FILES=""
          for file in "${PATHS[@]}"; do
            # The downstream text contract is one path per line. Reject an
            # unsupported name instead of silently inspecting a different file.
            if [[ "$file" == *$'\n'* || "$file" == *$'\r'* ]]; then
              echo "::error::Scan paths must not contain newline characters."
              exit 1
            fi
            FILES+="${file}"$'\n'
          done

          if [ -z "$FILES" ]; then
            echo "No agent/skill files changed."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            # Both scanners inspect the tree. Links can escape it, even when
            # their target is not in the changed-file list. Never follow them.
            LINKS=$(git ls-files --stage -- "${ROOTS[@]}" | awk '$1 == "120000" || $1 == "160000"')
            if [ -n "$LINKS" ]; then
              echo "::error::Agent and skill folders must not contain symlinks or submodules."
              exit 1
            fi
            echo "Files selected for review: ${#PATHS[@]}"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "changed_files=$(printf '%s' "$FILES" | base64 -w 0)" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────
  # Job 2: Test-file gate (deterministic, hard fail)
  #   Blocks the documented scanner bypass where a
  #   skill ships a clean SKILL.md plus a *.test.ts
  #   payload that Jest/Vitest/pytest auto-discover
  #   and execute with developer credentials.
  #   No agent is involved in that attack, so the
  #   LLM lenses cannot be the only control.
  # ──────────────────────────────────────────────
  test_file_gate:
    # Job names read as the story in the Actions graph:
    # four "Vote" jobs, one "Hard stop", one "Quorum Decision"
    name: "Hard stop: test-file gate"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    needs: detect_changes
    if: needs.detect_changes.outputs.has_changes == 'true'
    outputs:
      forbidden: ${{ steps.gate.outputs.forbidden }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Block executable payloads in agent/skill directories
        id: gate
        run: |
          # Full-tree check, not diff-only: a payload already merged is just as
          # dangerous as one arriving in this PR (OWASP AST02, Supply Chain).
          FORBIDDEN=""
          for root in .github/agents .github/skills .claude/agents .claude/skills .agents/skills; do
            [ -d "$root" ] || continue
            MATCHES=$(find "$root" \
              \( -name "*.test.*" -o -name "*.spec.*" -o -name "conftest.py" \
                 -o -name "*.config.*" -o -type d -name "__tests__" \) -print)
            [ -n "$MATCHES" ] && FORBIDDEN+="${MATCHES}"$'\n'
          done

          if [ -n "$FORBIDDEN" ]; then
            echo "forbidden=$(printf '%s' "$FORBIDDEN" | base64 -w 0)" >> "$GITHUB_OUTPUT"
            {
              echo "### ❌ Hard stop: test-file gate FAILED"
              echo ""
              echo "Executable payload files found inside agent/skill directories."
              echo "Repository policy keeps test, spec, and build-config files outside"
              echo "these folders because development tools may discover and execute"
              echo "them with developer credentials (OWASP AST02). A match is a policy"
              echo "violation; it does not by itself prove malicious behavior."
              echo ""
              echo '```'
              printf '%s' "$FORBIDDEN"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "❌ Forbidden files found:"
            printf '%s' "$FORBIDDEN"
            exit 1
          fi

          echo "forbidden=" >> "$GITHUB_OUTPUT"
          echo "✅ No executable payloads in agent/skill directories."
          {
            echo "### ✅ Hard stop: test-file gate passed"
            echo "No test, spec, or build-config files inside agent/skill folders."
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────
  # Job 3: Structural validation (deterministic)
  # ──────────────────────────────────────────────
  validate_structure:
    name: "Advisory: structure check"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    needs: detect_changes
    if: needs.detect_changes.outputs.has_changes == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate YAML frontmatter
        run: |
          FILES=$(echo "${{ needs.detect_changes.outputs.changed_files }}" | base64 -d)
          WARNINGS=0

          echo "=== Structural Validation ==="
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && echo "  SKIP: $file (not found)" && continue

            # Frontmatter rules only apply to instruction markdown; bundled
            # scripts are covered by the test-file gate and the LLM/static scans
            case "$file" in
              *.md) ;;
              *) echo "  SKIP (non-markdown): $file"; continue ;;
            esac

            echo "  Checking: $file"

            # Check frontmatter exists (file starts with ---)
            if ! head -1 "$file" | grep -q '^---$'; then
              echo "    WARNING: No YAML frontmatter"
              WARNINGS=$((WARNINGS + 1))
              continue
            fi

            # Extract frontmatter content
            FRONT=$(sed -n '2,/^---$/p' "$file" | sed '$d')

            # Check description exists
            if ! echo "$FRONT" | grep -q '^description:'; then
              echo "    WARNING: Missing 'description' field"
              WARNINGS=$((WARNINGS + 1))
            fi

            # Check for wildcard tool access
            if echo "$FRONT" | grep -qiE 'tools:.*(\*|"all"|all)'; then
              echo "    WARNING: Wildcard or unrestricted tool access"
              WARNINGS=$((WARNINGS + 1))
            fi

          done <<< "$FILES"

          echo ""
          echo "Structural warnings: $WARNINGS"
          # Structural issues are informational — the quorum is the gate

  # ──────────────────────────────────────────────
  # Job 4: LLM evaluation (3x parallel via matrix)
  #   Uses GitHub Copilot CLI in programmatic mode.
  #   One model per vendor (OpenAI, Anthropic,
  #   Google) so the three votes are not the same
  #   model three times. Model IDs retire: the
  #   weekly copilot-probe workflow checks them.
  # ──────────────────────────────────────────────
  llm_scan:
    name: "Vote: ${{ matrix.lens }} lens (${{ matrix.vendor }} ${{ matrix.model }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: detect_changes
    if: needs.detect_changes.outputs.has_changes == 'true'
    strategy:
      matrix:
        include:
          - lens: security
            vendor: OpenAI
            model: gpt-5.5
          - lens: privilege
            vendor: Anthropic
            model: claude-sonnet-5
          - lens: compliance
            vendor: Google
            model: gemini-3.7-flash
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # PR-controlled package metadata must not enable an unexpected cache.
          package-manager-cache: false

      - name: Install Copilot CLI
        # Avoid PR-controlled npm configuration while installing the analyzer.
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g "@github/copilot@${COPILOT_CLI_VERSION}"
          copilot --version

      - name: "Evaluate: ${{ matrix.lens }} lens via ${{ matrix.model }}"
        run: |
          FILES=$(echo "${{ needs.detect_changes.outputs.changed_files }}" | base64 -d)
          LENS="${{ matrix.lens }}"
          mkdir -p results

          # Build file contents block. Each file is wrapped in explicit
          # untrusted-content markers so a malicious file cannot pose as
          # instructions to the evaluator (prompt injection at scan time).
          FILE_CONTENTS=""
          UNREADABLE=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            # A changed file the scanner cannot open is a file it cannot vouch
            # for. Record it and fail closed below; never skip it silently.
            if [ ! -f "$file" ]; then
              UNREADABLE+="${file} "
              continue
            fi
            # Never issue SAFE for a file we silently truncated or omitted.
            # Empty files contain no instructions and can be represented as such.
            if [ -s "$file" ] && { ! grep -qI . "$file" || [ "$(wc -c < "$file")" -gt 16384 ]; }; then
              UNREADABLE+="${file} (binary or over 16 KiB) "
              continue
            fi
            FILE_CONTENTS+="=== BEGIN UNTRUSTED FILE: ${file} ==="$'\n'
            FILE_CONTENTS+="$(cat "$file")"$'\n'
            FILE_CONTENTS+="=== END UNTRUSTED FILE: ${file} ==="$'\n\n'
          done <<< "$FILES"

          MODEL="${{ matrix.model }}"
          if [ -n "$UNREADABLE" ]; then
            echo "FAIL-SAFE: could not read changed file(s): ${UNREADABLE}. Voting UNSAFE."
            jq -n --arg m "$MODEL" --arg l "$LENS" --arg f "$UNREADABLE" \
              '{verdict:"UNSAFE",findings:[{id:"AST08",file:null,detail:("Scanner could not read changed file(s): " + $f)}],model:$m,lens:$l,error:true}' \
              > "results/${LENS}.json"
            cat "results/${LENS}.json"
            exit 0
          fi

          # Load prompts
          LENS_PROMPT=$(cat "prompts/lens-${LENS}.txt")
          BASE_PROMPT=$(cat "prompts/v1.txt")
          FULL_PROMPT="${LENS_PROMPT}"$'\n\n'"${BASE_PROMPT}"$'\n'"${FILE_CONTENTS}"

          echo "Asking ${VENDOR} ${MODEL} to judge the changed files through the ${LENS} lens ($(echo "$FULL_PROMPT" | wc -c) chars)..."

          # Write prompt to temp file to avoid shell escaping issues
          echo "$FULL_PROMPT" > /tmp/prompt.txt

          # The CLI loads project config (agents, skills, hooks, MCP servers,
          # AGENTS.md-style instructions) from its working directory. The
          # checkout IS the untrusted PR, so run from an empty folder outside
          # it, with a fresh config home. The PR's files reach the model only
          # as text inside the prompt, never as configuration.
          ANALYZER_DIR="$RUNNER_TEMP/asq-analyzer"
          mkdir -p "$ANALYZER_DIR"
          export COPILOT_HOME="$RUNNER_TEMP/asq-copilot-home"

          # --output-format json returns JSONL (one JSON event per line).
          # The analyzer needs no tools: everything it judges is in the prompt.
          # No fallback to the default model: a voter that cannot run its own
          # model must not quietly become a copy of another voter. A rejected
          # model yields no verdict, and its error result fails the decision.
          set +e
          ( cd "$ANALYZER_DIR" && copilot -p "$(cat /tmp/prompt.txt)" \
              --model "$MODEL" \
              --output-format json \
              --no-auto-update \
              --no-ask-user \
              --no-custom-instructions \
              --disable-builtin-mcps \
              --deny-tool=read \
              --deny-tool=url \
              --deny-tool=memory \
              --deny-tool=shell \
              --deny-tool=write ) > /tmp/copilot-output.jsonl 2>/tmp/copilot-stderr.txt
          EXIT_CODE=$?
          set -e

          # Plumbing details fold into one collapsible group, so the log
          # reads as question, verdict, reasons
          echo "::group::Diagnostics (CLI exit code, event stream, extracted text)"
          echo "Copilot CLI exit code: $EXIT_CODE (model: $MODEL)"
          if [ -s /tmp/copilot-stderr.txt ]; then
            echo "Copilot CLI stderr:"
            cat /tmp/copilot-stderr.txt
          fi
          JSONL_LINES=$(wc -l < /tmp/copilot-output.jsonl)
          JSONL_BYTES=$(wc -c < /tmp/copilot-output.jsonl)
          echo "JSONL output: $JSONL_LINES lines, $JSONL_BYTES bytes"

          # Debug: show event types in the JSONL stream
          echo "Event types:"
          jq -r '.type // "no-type"' /tmp/copilot-output.jsonl 2>/dev/null | sort | uniq -c | sort -rn || true

          # --- Extract the model's reply from the JSONL event stream ---
          # Read ONLY assistant.message events. The stream also echoes the
          # prompt back (user.message), and the prompt contains a SAFE example
          # verdict: reading every string made every voter "vote" SAFE no
          # matter what the model said. No reply means no verdict, and the
          # fail-safe below emits an error result.
          TEXT=$(jq -r 'select(.type == "assistant.message") | .data.content // empty' \
            /tmp/copilot-output.jsonl 2>/dev/null | tr -d '\0')

          echo "Extracted text: $(echo "$TEXT" | wc -c) chars"
          echo "::endgroup::"

          # --- Extract verdict JSON using balanced brace matching ---
          VERDICT_JSON=$(perl -0777 -ne '
            while (/(\{(?:[^{}]|(?1))*\})/g) {
              my $block = $1;
              if ($block =~ /"verdict"/) { print $block; last; }
            }
          ' <<< "$TEXT" 2>/dev/null)

          # --- Parse, validate, and normalize findings to the shared contract:
          #     {id: AST01..AST10|UNMAPPED, file, detail}
          #     String findings from older prompts are tolerated and wrapped.
          PARSED=""
          # A partial answer from a failed process cannot authorize a pass.
          if [ "$EXIT_CODE" -eq 0 ] && [ -n "$VERDICT_JSON" ] && echo "$VERDICT_JSON" | jq -e '.verdict' > /dev/null 2>&1; then
            V=$(echo "$VERDICT_JSON" | jq -r '.verdict')
            if [ "$V" = "SAFE" ] || [ "$V" = "UNSAFE" ]; then
              echo "$VERDICT_JSON" | jq --arg m "$MODEL" --arg l "$LENS" '{
                verdict,
                findings: [ (.findings // [])[]
                  | if type == "string"
                    then {id: "UNMAPPED", file: null, detail: .}
                    else {id: (.id // "UNMAPPED"), file: (.file // null), detail: (.detail // .message // tostring)}
                    end ],
                model: $m,
                lens: $l
              }' > "results/${LENS}.json"
              PARSED="yes"
              echo "Verdict: $V"
            fi
          fi

          # Fail-safe
          if [ -z "$PARSED" ]; then
            echo "FAIL-SAFE: No valid verdict extracted. Voting UNSAFE."
            jq -n --arg m "$MODEL" --arg l "$LENS" \
              '{verdict:"UNSAFE",findings:[{id:"UNMAPPED",file:null,detail:"Evaluation failed or returned invalid response"}],model:$m,lens:$l,error:true}' \
              > "results/${LENS}.json"
          fi

          cat "results/${LENS}.json"
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          VENDOR: ${{ matrix.vendor }}

      - name: Summarize vote
        if: always()
        env:
          VENDOR: ${{ matrix.vendor }}
          LENS: ${{ matrix.lens }}
        run: |
          # The run's summary page is where people read the story: each voter
          # states its verdict, its engine, and its reasons in plain words
          FILE="results/${LENS}.json"
          if [ ! -f "$FILE" ]; then
            echo "### ⚠️ ERROR: ${LENS} lens produced no result; scan must fail" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -r --arg vendor "$VENDOR" '
            "### \(if .error then "⚠️ ERROR" else .verdict end): \(.lens) lens",
            "Requested engine: \($vendor) `\(.model)`\(if .error then " (no valid answer; the scan must fail)" else "" end)",
            "",
            (.findings[]? | "- **\(.id)** `\(.file // "n/a")`: \(.detail)")
          ' "$FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "eval-result-${{ matrix.lens }}"
          path: "results/${{ matrix.lens }}.json"
          if-no-files-found: error
          retention-days: 90

  # ──────────────────────────────────────────────
  # Job 5: Static scan (4th quorum voter)
  #   Cisco's open-source skill-scanner: YARA rules,
  #   AST dataflow, and taint analysis. Mixed-mode
  #   consensus means a bypass must defeat two
  #   fundamentally different detection classes,
  #   not just fool three LLMs.
  # ──────────────────────────────────────────────
  static_scan:
    name: "Vote: static analysis (Cisco skill-scanner)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: detect_changes
    if: needs.detect_changes.outputs.has_changes == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Cisco skill-scanner
        # Pinned (see workflow env): the verdict logic below parses this
        # version's JSON, so an upgrade is a deliberate, tested change
        working-directory: ${{ runner.temp }}
        run: python -m pip install "cisco-ai-skill-scanner==${SKILL_SCANNER_VERSION}"

      - name: Scan agent/skill directories
        run: |
          mkdir -p results
          RAW_DIR=$(mktemp -d)
          DIRS_PRESENT=0
          SCANNED=0

          for root in .github/agents .github/skills .claude/agents .claude/skills .agents/skills; do
            [ -d "$root" ] || continue
            DIRS_PRESENT=$((DIRS_PRESENT + 1))
            # "scan" prefix: every root starts with a dot, and a dot-named file
            # is invisible to the *.json glob below (it silently read nothing)
            OUT="${RAW_DIR}/scan$(echo "$root" | tr '/' '-').json"
            # --lenient accepts non-standard layouts (Claude Code agents are
            # bare .md files, not SKILL.md packages). Without --fail-on-findings,
            # detected risks leave the process successful; a nonzero exit means
            # incomplete analysis. Findings decide the vote, then quorum gates it.
            set +e
            skill-scanner scan-all "$root" --recursive --lenient --format json > "$OUT" 2>"${OUT}.err"
            EXIT_CODE=$?
            set -e
            echo "[$root] skill-scanner exit code: $EXIT_CODE"
            # Accept the pinned scanner's Report schema, not any JSON object.
            # Partial analyzer failure or skipped packages are incomplete evidence.
            if [ "$EXIT_CODE" -ne 0 ] || ! jq -e '
              type == "object" and (.summary | type == "object") and
              (.results | type == "array" and length > 0) and
              ((.summary.skills_skipped // [] | length) == 0) and
              all(.results[]; (.findings | type == "array") and
                ((.analyzers_failed // [] | length) == 0))
            ' "$OUT" > /dev/null 2>&1; then
              echo "[$root] Missing, invalid, or incomplete scan report. stderr:"
              cat "${OUT}.err" || true
              rm -f "$OUT"
              continue
            fi
            SCANNED=$((SCANNED + 1))
          done

          RAW_FILES=$(ls "$RAW_DIR"/*.json 2>/dev/null || true)

          # Scanned but found no report files to read: falls through to the
          # fail-closed branch. Empty input must never mean SAFE.
          if [ "$SCANNED" -gt 0 ] && [ "$SCANNED" -eq "$DIRS_PRESENT" ] && [ -n "$RAW_FILES" ]; then
            # Normalize active findings only; suppressed findings are not votes.
            # The validated Report schema is Cisco's. Critical/high = UNSAFE.
            HIGH=$(jq -s '[.[] | (.results[].findings[], (.cross_skill_findings // [])[]) | .severity | tostring | ascii_downcase
                           | select(. == "critical" or . == "high")] | length' $RAW_FILES)
            FINDINGS=$(jq -s '[.[] | (.results[].findings[], (.cross_skill_findings // [])[])
              | {id: "UNMAPPED",
                 file: (.file // .file_path // .path // .skill // null),
                 detail: ((.severity | tostring | ascii_downcase) + ": "
                          + (.title // .message // .description // .rule_id // "static analysis finding"))}]
              | unique | .[0:30]' $RAW_FILES)
            if [ "$HIGH" -gt 0 ]; then VERDICT="UNSAFE"; else VERDICT="SAFE"; fi
            jq -n --arg v "$VERDICT" --argjson f "$FINDINGS" \
              '{verdict: $v, findings: $f, model: "cisco-skill-scanner", lens: "static"}' > results/static.json
            echo "Verdict: $VERDICT (critical/high findings: $HIGH)"
          elif [ "$DIRS_PRESENT" -eq 0 ]; then
            # Changed files were all deletions: nothing on disk to scan
            jq -n '{verdict:"SAFE", findings:[], model:"cisco-skill-scanner", lens:"static"}' > results/static.json
            echo "Verdict: SAFE (no agent/skill directories present after change)"
          else
            # Fail closed: directories exist but the scanner produced nothing usable
            jq -n '{verdict:"UNSAFE",findings:[{id:"UNMAPPED",file:null,detail:"Static scanner did not produce a valid report for every directory"}],model:"cisco-skill-scanner",lens:"static",error:true}' \
              > results/static.json
            echo "FAIL-SAFE: static scanner produced no parseable output. Voting UNSAFE."
          fi

          cat results/static.json

      - name: Summarize vote
        if: always()
        run: |
          # Same story format as the three AI voters, for the run summary page
          FILE="results/static.json"
          if [ ! -f "$FILE" ]; then
            echo "### ⚠️ ERROR: static analysis produced no result; scan must fail" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -r '
            "### \(if .error then "⚠️ ERROR" else .verdict end): static analysis",
            "Engine: Cisco `\(.model)` (pattern rules and code-flow analysis, no AI)\(if .error then ", fail-safe: no usable output" else "" end)",
            "",
            (.findings[]? | "- \(.detail)")
          ' "$FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "eval-result-static"
          path: "results/static.json"
          if-no-files-found: error
          retention-days: 90

  # ──────────────────────────────────────────────
  # Job 6: Aggregate votes and apply quorum
  #   Runs even when upstream jobs fail (always())
  #   so a red Test-File Gate still produces a red
  #   Quorum Decision — required-check protection
  #   would otherwise treat a skipped job as passed.
  # ──────────────────────────────────────────────
  aggregate:
    name: Quorum Decision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The only job that writes: it comments on the PR and uploads SARIF.
    # It installs nothing and runs no model, so it can hold these safely.
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    needs: [detect_changes, test_file_gate, validate_structure, llm_scan, static_scan]
    if: always()
    steps:
      - name: Report no relevant changes
        if: needs.detect_changes.result == 'success' && needs.detect_changes.outputs.has_changes == 'false'
        run: |
          # A genuine no-op still supplies the required check, without model calls.
          echo '## PASS: no agent, skill, or scanner changes require review' >> "$GITHUB_STEP_SUMMARY"
          echo 'No reviewers ran. This is a scope decision, not four SAFE votes.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.detect_changes.outputs.has_changes == 'true'
        with:
          persist-credentials: false

      - name: Download all evaluation results
        if: needs.detect_changes.outputs.has_changes == 'true'
        # Missing artifacts must reach the decision step as errors.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: eval-result-*
          path: results/
          merge-multiple: true

      - name: Apply quorum
        if: always() && needs.detect_changes.outputs.has_changes == 'true'
        id: quorum
        run: |
          echo "=========================================="
          echo "  QUORUM AGGREGATION"
          echo "=========================================="

          SAFE=0
          UNSAFE=0
          ERRORS=0

          for lens in security privilege compliance static; do
            FILE="results/${lens}.json"
            # Failure to obtain evidence is different from an unsafe finding.
            # One missing, malformed, or explicitly failed voter stops the scan.
            if [ ! -f "$FILE" ] || ! jq -e '
              type == "object" and (.error != true) and
              (.verdict == "SAFE" or .verdict == "UNSAFE") and
              (.findings | type == "array")
            ' "$FILE" > /dev/null 2>&1; then
              echo "  [${lens}] ERROR - no valid evaluation"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            VERDICT=$(jq -r '.verdict // "UNKNOWN"' "$FILE")
            case "$VERDICT" in
              SAFE)   echo "  [${lens}] SAFE";   SAFE=$((SAFE + 1)) ;;
              UNSAFE) echo "  [${lens}] UNSAFE"; UNSAFE=$((UNSAFE + 1)) ;;
              *)      echo "  [${lens}] ERROR - unknown verdict"; ERRORS=$((ERRORS + 1)) ;;
            esac
          done

          GATE_RESULT="${{ needs.test_file_gate.result }}"
          echo ""
          echo "  Test-file gate: $GATE_RESULT"
          echo "  SAFE: $SAFE / UNSAFE: $UNSAFE"
          echo "  Evaluation errors: $ERRORS"

          # Three triggers for FAIL:
          #   1. Quorum: >=2 of 4 evaluators vote UNSAFE
          #   2. Gate: forbidden executable files present (deterministic, no vote)
          #   3. Incomplete evidence: even one broken voter prevents a pass
          if [ "$UNSAFE" -ge 2 ] || [ "$GATE_RESULT" != "success" ] || [ "$ERRORS" -gt 0 ]; then
            echo "  QUORUM: FAIL"
            echo "result=FAIL" >> "$GITHUB_OUTPUT"
          else
            echo "  QUORUM: PASS"
            echo "result=PASS" >> "$GITHUB_OUTPUT"
          fi

          echo "safe=$SAFE" >> "$GITHUB_OUTPUT"
          echo "unsafe=$UNSAFE" >> "$GITHUB_OUTPUT"
          echo "errors=$ERRORS" >> "$GITHUB_OUTPUT"
          echo "gate=$GATE_RESULT" >> "$GITHUB_OUTPUT"

          # One plain-English sentence for people, not parsers. The run page
          # annotation, job summary, and PR comment all tell this same story.
          REASONS=""
          [ "$UNSAFE" -ge 2 ] && REASONS="${UNSAFE} of 4 checks voted UNSAFE (2 are enough to fail)"
          [ "$ERRORS" -gt 0 ] && REASONS="${REASONS:+$REASONS; }${ERRORS} evaluator(s) did not produce a valid answer"
          case "$GATE_RESULT" in
            success) ;;
            failure) REASONS="${REASONS:+$REASONS, and }the test-file gate found executable files hidden in a skill folder" ;;
            *)       REASONS="${REASONS:+$REASONS, and }the test-file gate did not finish, so the scan fails closed" ;;
          esac
          if [ -n "$REASONS" ]; then
            HEADLINE="Scan failed: ${REASONS}."
            echo "::error title=Scan failed::${REASONS}."
          else
            HEADLINE="Scan passed: ${UNSAFE} of 4 checks voted UNSAFE (2 are needed to fail), all evaluators answered, and the test-file gate passed."
            echo "::notice title=Scan passed::${HEADLINE}"
          fi
          echo "headline=$HEADLINE" >> "$GITHUB_OUTPUT"

      - name: Generate SARIF
        if: always() && needs.detect_changes.outputs.has_changes == 'true'
        run: |
          # Findings land in the GitHub Security tab via code scanning, mapped
          # to OWASP Agentic Skills Top 10 rule IDs (AST01..AST10)
          EXISTING=""
          for lens in security privilege compliance static; do
            [ -f "results/${lens}.json" ] && EXISTING="$EXISTING results/${lens}.json"
          done

          if [ -n "$EXISTING" ]; then
            COMBINED=$(jq -s '[ .[] | . as $r | ($r.findings // [])[]
              | {id: (.id // "UNMAPPED"),
                 file: (.file // null),
                 detail: (.detail // "finding"),
                 evaluator: (($r.lens // "unknown") + "/" + ($r.model // "unknown")),
                 verdict: ($r.verdict // "UNKNOWN")} ]' $EXISTING)
          else
            COMBINED="[]"
          fi

          # Fold the deterministic gate verdict in as an AST02 finding
          GATE_RESULT="${{ needs.test_file_gate.result }}"
          if [ "$GATE_RESULT" != "success" ]; then
            GATE_FILES=$(echo "${{ needs.test_file_gate.outputs.forbidden }}" | base64 -d 2>/dev/null || true)
            COMBINED=$(jq --arg files "$GATE_FILES" '
              ($files | split("\n") | map(select(length > 0))) as $list |
              . + [{id: "AST02",
                    file: ($list | first),
                    detail: ("Forbidden executable file(s) in agent/skill directories: " + ($list | join(", "))),
                    evaluator: "test-file-gate/deterministic",
                    verdict: "UNSAFE"}]' <<< "$COMBINED")
          fi

          # Findings without a usable file path anchor to the first changed file
          DEFAULT_FILE=$(echo "${{ needs.detect_changes.outputs.changed_files }}" | base64 -d | head -1)
          [ -z "$DEFAULT_FILE" ] && DEFAULT_FILE=".github/workflows/agent-scan.yml"

          jq -n --argjson findings "$COMBINED" --arg defaultFile "$DEFAULT_FILE" '
            {"AST01": "Malicious Skills",
             "AST02": "Supply Chain Compromise",
             "AST03": "Over-Privileged Skills",
             "AST04": "Insecure Metadata",
             "AST05": "Untrusted External Instructions",
             "AST06": "Weak Isolation",
             "AST07": "Update Drift",
             "AST08": "Poor Scanning",
             "AST09": "No Governance",
             "AST10": "Cross-Platform Reuse",
             "UNMAPPED": "Agent security finding"} as $titles |
            def cleanfile:
              if . == null or . == "" or . == "null" then null
              elif startswith("/") or startswith("http") then null
              else . end;
            {
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                "tool": {"driver": {
                  "name": "agent-security-quorum",
                  "informationUri": "https://github.com/timothywarner-org/agent-security-quorum",
                  "rules": ([$findings[].id] | unique | map({
                    "id": .,
                    "shortDescription": {"text": ("OWASP Agentic Skills " + . + ": " + ($titles[.] // "Agent security finding"))}
                  }))
                }},
                "results": ($findings | map({
                  "ruleId": .id,
                  "level": (if .verdict == "UNSAFE" then "error" else "note" end),
                  "message": {"text": ("[" + .evaluator + "] " + .detail)},
                  "locations": [{"physicalLocation": {
                    "artifactLocation": {"uri": ((.file | cleanfile) // $defaultFile)},
                    "region": {"startLine": 1}
                  }}]
                }))
              }]
            }' > results/scan.sarif

          echo "SARIF results: $(jq '.runs[0].results | length' results/scan.sarif)"

      - name: Upload SARIF to code scanning
        if: always() && needs.detect_changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        # Fork PRs lack security-events permission; the scan itself still gates
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results/scan.sarif
          category: agent-security-quorum

      - name: Write job summary
        if: always() && needs.detect_changes.outputs.has_changes == 'true'
        env:
          HEADLINE: ${{ steps.quorum.outputs.headline }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Agent/Skill Security Scan"
            echo ""
            # Fail-closed wording if the quorum step never produced a headline
            echo "**${HEADLINE:-Scan failed: the scan did not complete, so it fails closed.}**"
            echo ""
            # Provenance travels with every screenshot: which commit, which run
            echo "Scanned commit \`${HEAD_SHA:0:7}\` in [run ${GITHUB_RUN_ID}](${RUN_URL})"
            echo ""
            echo "| Evaluator | Requested model / static engine | Verdict |"
            echo "|-----------|--------|---------|"
            for lens in security privilege compliance static; do
              FILE="results/${lens}.json"
              if [ -f "$FILE" ] && jq -e 'type == "object" and (.error != true) and (.verdict == "SAFE" or .verdict == "UNSAFE") and (.findings | type == "array")' "$FILE" > /dev/null 2>&1; then
                V=$(jq -r '.verdict' "$FILE")
                M=$(jq -r '.model // "unknown"' "$FILE")
                [ "$V" = "SAFE" ] && echo "| ${lens} | ${M} | ✅ SAFE |" || echo "| ${lens} | ${M} | ❌ UNSAFE |"
              else
                echo "| ${lens} | unavailable | ⚠️ ERROR |"
              fi
            done
            GATE="${{ steps.quorum.outputs.gate }}"
            [ "$GATE" = "success" ] && echo "| test-file gate | deterministic | ✅ PASS |" || echo "| test-file gate | deterministic | ❌ FAIL |"
            echo ""
            echo "**Decision: ${{ steps.quorum.outputs.result || 'FAIL' }}** (${{ steps.quorum.outputs.unsafe || 0 }}/4 UNSAFE; ${{ steps.quorum.outputs.errors || 0 }} evaluation errors)"
            echo ""
            echo "Policy: 2 UNSAFE votes, any evaluation error, or a failed hard stop fails the scan. One UNSAFE vote can pass and still deserves human review."
            echo ""
            echo "This is a scan result. Requiring Quorum Decision in branch protection is what enforces it at merge. SAFE is not a safety certificate."
            echo ""
            echo "Model names record the requested configuration, not independently verified backend identity. Each voter summary above contains its findings."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: always() && needs.detect_changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        # Reporting is supplementary; a comment API failure is not a security vote.
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEADLINE: ${{ steps.quorum.outputs.headline }}
        with:
          script: |
            // Fall back to FAIL if the quorum step never produced an output
            // (fail-closed: a comment must never imply PASS on an incomplete run)
            const result = '${{ steps.quorum.outputs.result }}' || 'FAIL';
            const safe = ${{ steps.quorum.outputs.safe || 0 }};
            const unsafe = ${{ steps.quorum.outputs.unsafe || 0 }};
            const errors = ${{ steps.quorum.outputs.errors || 0 }};
            const gate = '${{ steps.quorum.outputs.gate }}' || 'unknown';
            const icon = result === 'PASS' ? '✅' : '❌';

            const fs = require('fs');
            const lenses = ['security', 'privilege', 'compliance', 'static'];
            const rows = [];
            const findingsBlocks = [];

            const renderFinding = (f) => {
              if (typeof f === 'string') return `- ${f}`;
              const id = f.id || 'UNMAPPED';
              const file = f.file ? ` \`${f.file}\`` : '';
              return `- **${id}**${file}: ${f.detail || JSON.stringify(f)}`;
            };

            for (const lens of lenses) {
              try {
                const data = JSON.parse(fs.readFileSync(`results/${lens}.json`, 'utf8'));
                const valid = !data.error && ['SAFE', 'UNSAFE'].includes(data.verdict) && Array.isArray(data.findings);
                const vi = !valid ? '⚠️ ERROR' : data.verdict === 'SAFE' ? '✅ SAFE' : '❌ UNSAFE';
                const model = data.model || 'unknown';
                rows.push(`| ${lens} | ${model} | ${vi} |`);

                if (Array.isArray(data.findings) && data.findings.length > 0 && (data.error || data.verdict === 'UNSAFE')) {
                  const items = data.findings.map(renderFinding).join('\n');
                  findingsBlocks.push(`**${lens}** (${model}):\n${items}`);
                }
              } catch {
                rows.push(`| ${lens} | unavailable | ⚠️ ERROR |`);
              }
            }

            rows.push(`| test-file gate | deterministic | ${gate === 'success' ? '✅ PASS' : '❌ FAIL'} |`);

            if (gate !== 'success') {
              const forbiddenB64 = '${{ needs.test_file_gate.outputs.forbidden }}';
              const forbidden = Buffer.from(forbiddenB64 || '', 'base64').toString('utf8').trim();
              if (forbidden) {
                const items = forbidden.split('\n')
                  .map(f => `- **AST02** \`${f}\`: forbidden executable file in agent/skill directory`)
                  .join('\n');
                findingsBlocks.push(`**test-file gate** (deterministic):\n${items}`);
              } else {
                findingsBlocks.push(`**test-file gate** (deterministic):\n- **AST02**: gate did not complete; treat as failed (fail-closed)`);
              }
            }

            // Same one-sentence story as the run page; fail-closed wording if missing
            const headline = process.env.HEADLINE || 'Scan failed: the scan did not complete, so it fails closed.';

            const marker = '<!-- agent-security-quorum -->';
            let body = `${marker}\n## ${icon} Agent/Skill Security Scan\n\n**${headline}**\n\n`;
            body += `| Evaluator | Requested model / static engine | Verdict |\n|-----------|--------|---------|\n${rows.join('\n')}\n\n`;
            body += `**Decision: ${result}** (${unsafe}/4 UNSAFE; ${errors} evaluation errors)\n`;
            body += '\nTwo UNSAFE votes, any evaluation error, or a failed hard stop fails the scan. Branch protection must require **Quorum Decision** to enforce it at merge. Model names are requested configuration, not independently verified backend identity.\n';

            if (findingsBlocks.length > 0) {
              if (result === 'FAIL') {
                body += `\n### Findings\n\n${findingsBlocks.join('\n\n')}\n`;
              } else {
                body += `\n<details>\n<summary>Findings (${findingsBlocks.length} evaluator(s))</summary>\n\n${findingsBlocks.join('\n\n')}\n</details>\n`;
              }
            }

            // Provenance in the footer so every screenshot proves which commit
            // and which run it came from, after the run logs expire
            const sha = (context.payload.pull_request?.head?.sha || '').slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            body += `\n---\n*Scanned commit \`${sha}\` in [run ${context.runId}](${runUrl}) by [agent-security-quorum](https://github.com/timothywarner-org/agent-security-quorum)*`;

            // Only edit this bot's own report, never a user's matching comment.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user?.login === 'github-actions[bot]' &&
              (c.body.includes(marker) || /^## [✅❌] Agent\/Skill Security Scan/.test(c.body))
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Enforce final decision
        # Missing detection output must never look like a successful scope skip.
        if: always()
        env:
          DETECTION_RESULT: ${{ needs.detect_changes.result }}
          HAS_CHANGES: ${{ needs.detect_changes.outputs.has_changes }}
          DECISION: ${{ steps.quorum.outputs.result }}
        run: |
          if [ "$DETECTION_RESULT" = "success" ]; then
            if [ "$HAS_CHANGES" = "false" ]; then exit 0; fi
            if [ "$HAS_CHANGES" = "true" ] && [ "$DECISION" = "PASS" ]; then exit 0; fi
          fi
          echo '## FAIL: scan failed or required evidence is incomplete' >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Quorum Decision did not establish a valid PASS."
          exit 1
