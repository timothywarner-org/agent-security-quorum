# Weekly check that the scanner's Copilot access still works.
#
# The scanner has two ways to break without anyone noticing: the COPILOT_PAT
# secret expires, or GitHub retires a model ID listed in agent-scan.yml.
# Either one produces evaluation errors, and nobody finds
# out until an agent PR is blocked. This probe fails loudly instead: GitHub
# emails a failed scheduled run to the person who last edited the schedule.
#
# Note: GitHub disables scheduled workflows in public repos after 60 days
# without repository activity. Re-enable it from the Actions tab if needed.
name: Copilot Access Probe

on:
  schedule:
    - cron: "17 13 * * 1" # Mondays, 13:17 UTC; avoid the busy top of the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copilot-probe-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: Copilot Access Probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read scanner runtime configuration
        id: config
        run: |
          # The probe must exercise exactly the runtime used by the real scanner.
          echo "node=$(yq '.env.NODE_VERSION' .github/workflows/agent-scan.yml)" >> "$GITHUB_OUTPUT"

      - name: Check the COPILOT_PAT token
        id: token
        env:
          TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "## ERROR: Copilot token is missing" >> "$GITHUB_STEP_SUMMARY"
            echo "FAIL: the COPILOT_PAT secret is missing or empty"
            exit 1
          fi

          # The GitHub API answers 401 for an expired or revoked token. For a
          # token with an expiry date, it also returns that date in a header,
          # so the probe can warn before the token dies instead of after.
          CODE=$(curl -sS --connect-timeout 10 --max-time 30 -o /dev/null -D /tmp/headers.txt -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" https://api.github.com/user)
          echo "GitHub API status: $CODE"
          # An API error must not be mistaken for a token with no expiry.
          if [ "$CODE" != "200" ]; then
            echo "## ERROR: token check returned HTTP $CODE" >> "$GITHUB_STEP_SUMMARY"
            echo "FAIL: cannot validate COPILOT_PAT (HTTP $CODE). Check token validity and service availability."
            exit 1
          fi

          EXP=$(grep -i '^github-authentication-token-expiration:' /tmp/headers.txt | cut -d' ' -f2- | tr -d '\r' || true)
          if [ -z "$EXP" ]; then
            echo "Token expiration: none reported"
            echo "## Token accepted; no expiration reported" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          DAYS_LEFT=$(( ( $(date -d "$EXP" +%s) - $(date +%s) ) / 86400 ))
          echo "Token expiration: $EXP ($DAYS_LEFT days left)"
          {
            echo "## Copilot access maintenance"
            echo "Token accepted by GitHub. Expiration: **$EXP** ($DAYS_LEFT days remaining at this run)."
          } >> "$GITHUB_STEP_SUMMARY"
          # 14 days = two weekly runs of warning before the token expires
          if [ "$DAYS_LEFT" -lt 14 ]; then
            echo "**ACTION REQUIRED:** rotate the repository secret COPILOT_PAT before expiration. This run stops at the maintenance warning, so it does not test model availability." >> "$GITHUB_STEP_SUMMARY"
            echo "FAIL: COPILOT_PAT expires in $DAYS_LEFT days. Rotate it now."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.config.outputs.node }}
          package-manager-cache: false

      - name: Install the pinned Copilot CLI
        run: |
          # Read the version from agent-scan.yml so the probe tests exactly
          # what the scanner runs: one source of truth, nothing to drift
          VERSION=$(yq '.env.COPILOT_CLI_VERSION' .github/workflows/agent-scan.yml)
          npm install -g "@github/copilot@${VERSION}"
          copilot --version

      - name: Check every configured model still answers
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          # Same isolation and flags as the real scan (see agent-scan.yml)
          mkdir -p "$RUNNER_TEMP/probe"
          export COPILOT_HOME="$RUNNER_TEMP/probe-home"
          FAILED=0
          printf '\n| Requested model | Reply check |\n|---|---|\n' >> "$GITHUB_STEP_SUMMARY"

          for MODEL in $(yq '.jobs.llm_scan.strategy.matrix.include[].model' .github/workflows/agent-scan.yml); do
            set +e
            ( cd "$RUNNER_TEMP/probe" && copilot -p "Reply with exactly the word OK and nothing else." \
                --model "$MODEL" \
                --output-format json \
                --no-auto-update \
                --no-ask-user \
                --no-custom-instructions \
                --disable-builtin-mcps \
                --deny-tool=read \
                --deny-tool=url \
                --deny-tool=memory \
                --deny-tool=shell \
                --deny-tool=write ) > /tmp/out.jsonl 2>/tmp/err.txt
            EXIT=$?
            set -e

            # A nonempty event stream can contain only the echoed user prompt.
            # Require an actual assistant reply, just as the scanner does.
            if [ "$EXIT" -eq 0 ] && jq -se 'any(.[]; .type == "assistant.message" and ((.data.content // "" | gsub("^\\s+|\\s+$"; "")) == "OK"))' /tmp/out.jsonl >/dev/null 2>&1; then
              echo "OK:   $MODEL"
              echo "| $MODEL | PASS: assistant replied OK |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "FAIL: $MODEL (exit $EXIT)"
              echo "| $MODEL | ERROR: no valid OK reply |" >> "$GITHUB_STEP_SUMMARY"
              cat /tmp/err.txt
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "One or more models failed. If the token check passed, update the model IDs in agent-scan.yml."
            exit 1
          fi
